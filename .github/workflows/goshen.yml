name: Deploy React App via SSH

on:
  push:
    branches:
      - goshen  # Or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CI: false
      REACT_APP_BASE_URL: ${{ secrets.GOSHEN_BASE_URL }}
      REACT_APP_BASE_URL_SOCKET: ${{ secrets.GOSHEN_SOCKET_BASE_URL }}
      REACT_APP_PAYSTACK_PUBLIC_KEY: "pk_test_abea14b8413cb3f06f2d652fced67a2d1a29ede7"
      REACT_APP_APP_NAME: "GOSHEN COOP"
      NODE_ENV: "production"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18  # Change if needed

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Copy Files to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GOSHEN_SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.GOSHEN_SSH_PRIVATE_KEY }}
          port: 22
          source: "build/*"
          target: ${{ secrets.GOSHEN_WEB_ROOT_DIR }}

      - name: Restart App on Server (Optional)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GOSHEN_SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.GOSHEN_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.GOSHEN_WEB_ROOT_DIR }}
            echo "Deployment complete"
